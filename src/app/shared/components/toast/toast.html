<div class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-start gap-3 px-4 py-3 rounded-sm shadow-luxury-lg pointer-events-auto animate-fade-up"
      [class]="toastClasses(toast.type)"
    >
      <span class="text-lg leading-none mt-0.5">{{ toastIcon(toast.type) }}</span>
      <p class="text-sm font-medium flex-1">{{ toast.message }}</p>
      <button (click)="toastService.dismiss(toast.id)" class="opacity-60 hover:opacity-100 transition-opacity text-lg leading-none">
        &times;
      </button>
    </div>
  }
</div>
